<title>한글원샷 주소가 바뀌었어요</title>

<meta name="robots" content="noindex">
<script>
// 옛 주소에 남은 서비스 워커와 저장본을 지운 뒤 새 주소로 간다(2026-10-16 저장소 분리)
(async function () {
  try { if (navigator.serviceWorker) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } } catch (e) {}
  try { if (self.caches) { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.indexOf('oneshot-') === 0).map(k => caches.delete(k))); } } catch (e) {}
  location.replace('https://humanteacher89-cell.github.io/hangeul-oneshot/' + location.search + location.hash);
})();
</script>
